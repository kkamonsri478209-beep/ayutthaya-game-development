<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ปริศนาเงินพดด้วง: ข้ามกาลสู่อยุธยา</title>
<link rel="stylesheet" href="css/style.css?v=cover-cinematic-20261110">
<link rel="stylesheet" href="css/adventure-map.css?v=1">
<link rel="stylesheet" href="css/intro-cinematic.css?v=guardian-voice-20261111">
<style>
#sound-panel{position:fixed;right:12px;bottom:12px;z-index:70;display:flex;align-items:center;gap:8px;background:rgba(28,18,50,.92);border:1px solid #d9b76d;border-radius:12px;padding:7px 10px;color:#fff2d4;font:600 12px system-ui,sans-serif;box-shadow:0 4px 16px #0005}
#sound-panel button{cursor:pointer;color:#fff2d4;background:#44305e;border:1px solid #c7a35d;border-radius:8px;padding:6px 9px;font:inherit}
#sound-panel input{width:78px;accent-color:#efc56d}
@media(max-width:640px){#sound-panel{right:6px;bottom:5px;padding:5px;gap:5px;font-size:10px}#sound-panel input{width:52px}}
#music-welcome{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;background:rgba(15,9,34,.78);backdrop-filter:blur(4px);padding:20px}
#music-welcome.hidden{display:none}
#music-welcome button{max-width:90vw;padding:20px 28px;border-radius:18px;border:2px solid #f1ce7b;background:linear-gradient(140deg,#63387e,#33235b);color:#fff2ce;font:700 clamp(17px,3vw,25px) system-ui;box-shadow:0 8px 36px #0009;cursor:pointer}
</style>
</head>
<body>
<div id="music-welcome"><button id="music-welcome-btn" type="button">♪ แตะเพื่อเข้าสู่โลกอยุธยาและเปิดเพลง</button></div>
<main id="app">
  <div id="loading-overlay" class="loading-overlay hidden" role="status" aria-live="polite"><div class="loading-card"><div class="loading-spinner" aria-hidden="true"></div><strong>กำลังโหลดภาพการผจญภัย...</strong><span>โปรดรอสักครู่</span></div></div>
  <section id="cover-screen" class="screen" data-bg="game-cover.webp">
    <div class="cover-cinematic" aria-hidden="true">
      <div class="cover-cinematic-light"></div>
      <div class="cover-cinematic-mist"></div>
      <div class="cover-cinematic-particles"></div>
      <div class="cover-cinematic-vignette"></div>
    </div>
    <div class="cover-cinematic-caption" aria-hidden="true">เมื่อเหรียญเงินพดด้วงนำพา... กาลเวลาก็เริ่มเคลื่อนไหว</div>
    <button id="start-btn" class="fantasy-btn cover-start">เริ่มการผจญภัย ▶</button>
  </section>
  <section id="select-screen" class="screen hidden" data-bg="character-select.webp">
    <button id="choose-girl" class="choice choice-girl" aria-label="เลือกนักเรียนหญิง"><span>เลือกนักเรียนหญิง</span></button>
    <button id="choose-boy" class="choice choice-boy" aria-label="เลือกนักเรียนชาย"><span>เลือกนักเรียนชาย</span></button>
    <div id="selection-label" class="selection-label">เลือกตัวละครที่ต้องการ</div>
    <button id="select-next" class="fantasy-btn bottom-btn" disabled>ยืนยันตัวละคร ▶</button>
  </section>
  <section id="name-screen" class="screen hidden" data-bg="player-name-screen.webp">
    <form id="name-form" class="name-form">
      <label for="player-name" class="sr-only">ชื่อของนักเดินทาง</label>
      <input id="player-name" type="text" maxlength="18" autocomplete="off" placeholder="พิมพ์ชื่อของคุณ" required>
      <button class="fantasy-btn" type="submit">เริ่มออกเดินทาง ▶</button>
    </form>
  </section>
  <section id="game-screen" class="screen game-screen hidden">
    <canvas id="game" width="1280" height="720" aria-label="เกมสำรวจอยุธยา"></canvas>
    <div id="objective" class="objective">เดินไปทางขวาเพื่อกลับบ้าน</div>
    <div id="interaction-prompt" class="interaction-prompt hidden">กด E เพื่อโต้ตอบ</div>
    <div id="dialogue-box" class="dialogue-box hidden">
      <img id="dialogue-portrait" class="dialogue-portrait" alt="ผู้พูด">
      <div class="dialogue-content">
        <div id="speaker" class="speaker"></div>
        <div id="dialogue-text" class="dialogue-text"></div>
        <button id="dialogue-next-btn" class="fantasy-btn">ถัดไป ▶</button>
      </div>
    </div>
    <div id="quiz-panel" class="quiz-panel hidden" aria-live="polite">
      <div class="quiz-card">
        <div class="quiz-topline"><strong id="quiz-heading">ด่านที่ ๑ : วิถีชีวิตชาวนา</strong><span id="quiz-progress">ข้อ ๑ / ๕</span></div>
        <h2 id="quiz-question"></h2>
        <div id="quiz-answers" class="quiz-answers"></div>
        <p id="quiz-feedback" class="quiz-feedback"></p>
        <button id="quiz-next-btn" class="fantasy-btn hidden">ข้อต่อไป ▶</button>
      </div>
    </div>
  </section>

  <section id="result-screen" class="screen result-screen hidden" data-bg="stage9_result_background.png" aria-label="สรุปผลภารกิจสุดท้าย">
    <div class="royal-result-content">
      <div class="royal-result-copy">
        <div class="royal-result-subtitle">นักเดินทางข้ามกาลเวลา</div>
        <div id="result-player" class="royal-result-name"></div>
        <div class="royal-result-score-label">คะแนนบททดสอบสุดท้าย</div>
        <div id="result-score" class="royal-result-score" aria-live="polite"></div>
        <p id="result-message" class="royal-result-message"></p>
      </div>
      <img class="royal-result-medal" src="time_traveler_medal.png" alt="ตรารางวัลนักเดินทางข้ามกาลเวลา">
    </div>
    <div class="royal-result-controls">
      <button id="result-restart-btn" class="royal-result-button" type="button">เล่นใหม่</button>
      <button id="result-download-btn" class="royal-result-button" type="button">บันทึกผล</button>
    </div>
    <p id="result-save-status" class="royal-result-status" role="status"></p>
  </section>
  <div id="controls" class="controls hidden">
    <div class="control-help">เดินด้วย ← → หรือ A / D • กด E เพื่อสำรวจและพูดคุย</div>
    <div class="touch-controls">
      <button id="left-btn" aria-label="เดินซ้าย">◀</button>
      <button id="interact-btn">คุย / สำรวจ (E)</button>
      <button id="right-btn" aria-label="เดินขวา">▶</button>
    </div>
  </div>
</main>
<script src="js/game.js?v=coin-portal-direct-20261111"></script>
<script src="js/adventure-map.js?v=map-preload-sfx-20261111"></script>
<script src="js/intro-cinematic.js?v=guardian-voice-20261111"></script>
<script src="js/ambient-audio.js?v=welcome-music-20261110"></script>
<script src="js/ancient-temple-sfx.js?v=click-latency-20261111"></script>
</body>
</html>
