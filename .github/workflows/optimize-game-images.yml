name: Optimize game image assets (test branch)
on:
  push:
    branches:
      - performance-asset-loading-20261112
    paths:
      - ".github/workflows/optimize-game-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.ref == 'refs/heads/performance-asset-loading-20261112'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Convert remaining large PNG images without resizing
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path('.')
          # Keep original PNG files as backups. Existing WebP assets are not overwritten.
          new_assets = {}
          for src in sorted(root.glob('*.png')):
              dst = src.with_suffix('.webp')
              if dst.exists() or src.stat().st_size < 400_000:
                  continue
              with Image.open(src) as original:
                  image = original.convert('RGBA' if 'A' in original.getbands() else 'RGB')
                  image.save(dst, 'WEBP', quality=88, method=6)
              if dst.stat().st_size >= src.stat().st_size:
                  dst.unlink()
                  continue
              new_assets[src.name] = dst.name
              print('OPT', src.name, src.stat().st_size, '->', dst.stat().st_size)
          # Only replace explicit filename references; avoid changing educational text.
          for path in [Path('index.html'), *Path('js').glob('*.js'), *Path('css').glob('*.css')]:
              before = path.read_text(encoding='utf-8')
              after = before
              for old, new in new_assets.items():
                  after = after.replace(old, new)
              if after != before:
                  path.write_text(after, encoding='utf-8')
                  print('UPDATED REFERENCES', path)
          print('NEW_WEBP_COUNT', len(new_assets))
          PY
      - name: Validate JavaScript
        run: |
          for file in js/*.js; do node --check "$file"; done
      - name: Commit optimized assets to test branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.webp' js index.html css
          if ! git diff --cached --quiet; then
            git commit -m "perf: optimize remaining large PNG assets on test branch"
            git push origin HEAD:performance-asset-loading-20261112
          fi
