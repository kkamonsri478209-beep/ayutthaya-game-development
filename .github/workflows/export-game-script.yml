name: Export game dialogue and quiz Word document
on:
  push:
    paths:
      - 'tools/export_game_script.py'
      - 'js/game.js'
      - 'js/intro-cinematic.js'
      - '.github/workflows/export-game-script.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-docx
      - run: python tools/export_game_script.py
      - name: Commit Word document only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.docx'
          git diff --cached --quiet || (git commit -m "Export full game dialogue and quiz document" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: ayutthaya-dialogue-quiz-word
          path: '*.docx'
